name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # The transport tests need QUIC with TLS 1.3, which Windows Server 2022 and later have.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Promin.slnx -warnaserror
      - run: dotnet test Promin.slnx --no-build
